# SPDX-License-Identifier: Apache-2.0
name: Runtime contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # szl-holdings/.github hf-card toolkit (schema + D10 linter), pinned to a reviewed commit.
      HF_CARD_TOOLKIT_SHA: 4579c55d8a9d03f6d5e24fd2ab17bcc947d4bcd3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/.github
          ref: ${{ env.HF_CARD_TOOLKIT_SHA }}
          path: .hf-card-toolkit
          persist-credentials: false
          sparse-checkout: hf-card
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Lint the Space card against the org card contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .hf-card-toolkit rev-parse HEAD)" = "$HF_CARD_TOOLKIT_SHA"
          python -m venv "$RUNNER_TEMP/hf-card-venv"
          venv_python="$RUNNER_TEMP/hf-card-venv/bin/python"
          requirements=.hf-card-toolkit/hf-card/requirements.txt
          "$venv_python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r "$requirements"
          "$venv_python" .hf-card-toolkit/hf-card/lint.py space/README.md --type space
      - name: Prove candidate and behavior
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -I -B scripts/verify_publisher_workflow.py
          python -I -B scripts/verify_space.py
          git diff --check
      - name: Build and probe actual production container
        shell: bash
        run: |
          set -euo pipefail
          runtime_context="$(mktemp -d)"
          trap 'rm -rf "$runtime_context"' EXIT
          SOURCE_SHA="$SOURCE_SHA" RUNTIME_CONTEXT="$runtime_context" python -I -B - <<'PY'
          import os
          import runpy
          from pathlib import Path

          payload = runpy.run_path("scripts/publish_space.py")["payload"](os.environ["SOURCE_SHA"])
          target = Path(os.environ["RUNTIME_CONTEXT"])
          for name, body in payload.items():
              (target / name).write_bytes(body)
          PY
          docker build --tag holographic-unify:ci "$runtime_context"
          container="$(docker run --detach --publish 127.0.0.1:17860:7860 holographic-unify:ci)"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true; rm -rf "$runtime_context"' EXIT
          python -I -B scripts/verify_space.py --url http://127.0.0.1:17860 --timeout 60
          # The image's own HEALTHCHECK (/healthz) must report healthy, not just exist.
          health=""
          for _ in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$health" = healthy ]; then break; fi
            sleep 2
          done
          echo "container health: $health"
          test "$health" = healthy
      - name: Qualify whole-repository image assets without claiming publication
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag holographic-unify:source-ci .
          container="$(docker run --detach --publish 127.0.0.1:17861:7860 holographic-unify:source-ci)"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          python -I -B - <<'PY'
          import json
          import runpy
          import time
          import urllib.error
          from pathlib import Path

          contract = runpy.run_path('scripts/verify_space.py')
          request = contract['request']
          base = 'http://127.0.0.1:17861'
          for attempt in range(60):
              try:
                  assert request(base + '/healthz')[0] == 200
                  break
              except (OSError, AssertionError):
                  if attempt == 59:
                      raise
                  time.sleep(1)
          assets = {'/': 'text/html', **contract['STATIC_ASSETS']}
          for route, kind in assets.items():
              name = 'index.html' if route == '/' else route.removeprefix('/')
              expected = (Path('space') / name).read_bytes()
              status, body, actual_kind = request(base + route)
              assert status == 200 and actual_kind == kind and body == expected, route
              status, body, actual_kind = request(base + route, method='HEAD')
              assert status == 200 and actual_kind == kind and body == b'', route
          for route in ('/readyz', '/api/build-info'):
              try:
                  request(base + route)
              except urllib.error.HTTPError as response:
                  assert response.code == 503, route
                  assert json.loads(response.read())['state'] == 'SOURCE_BINDING_UNAVAILABLE', route
              else:
                  raise AssertionError('raw image must not invent publication identity: ' + route)
          print('Whole-repository image: 11 exact GET/HEAD asset routes; publication identity unavailable')
          PY
  grok-contract:
    name: grok-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run offline xAI gate contract suite (no dependency install)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e node_modules
          node --version
          npm run test:grok
      - name: Run offline catalog public-link guard (no dependency install)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e node_modules
          npm run test:catalog
