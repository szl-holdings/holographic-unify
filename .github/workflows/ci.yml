name: Runtime contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Verify source and publisher contracts
        run: |
          set -euo pipefail
          python -I -B scripts/verify_space.py
          python -I -B scripts/verify_publisher_workflow.py
          python -m py_compile \
            scripts/publish_space.py \
            scripts/verify_space.py \
            scripts/verify_publisher_workflow.py \
            space/server.py
          git diff --check

      - name: Build and probe production container
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag holographic-unify:ci space
          container="$(docker run --detach --publish 127.0.0.1:17860:7860 holographic-unify:ci)"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python -I -B scripts/verify_space.py --url http://127.0.0.1:17860 --timeout 60
