# SPDX-License-Identifier: Apache-2.0
name: Publish Holographic Unify Space
on:
  push:
    branches: [main]
    paths:
      - space/**
      - scripts/publish_space.py
      - scripts/verify_space.py
      - scripts/verify_publisher_workflow.py
      - tests/test_*.py
      - .github/workflows/deploy-hf-space.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: publish-holographic-unify-space
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'szl-holdings/holographic-unify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prove exact source and offline behavior before credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -I -B scripts/verify_publisher_workflow.py
          python -I -B scripts/verify_space.py
          git diff --check
      - name: Install existing pinned provider client
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'huggingface_hub==1.23.0'
      - name: Publish existing target and verify immutable provider and running bytes
        env:
          # Same fixed aliases and precedence as .github/hf-org-card-autopublish.yml.
          # Values remain within this step; no user-supplied or GitHub token fallback.
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 || secrets.HF_TOKEN || secrets.HF_WRITE_TOKEN }}
        run: python -I -B scripts/publish_space.py --apply --timeout 1200
      - name: Retain explicit pre-publisher failure
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'szl-holographic-receipt.json'
          if not p.exists():
              p.write_text(json.dumps({'schema':'szl.holographic-publish/v2',
                  'status':'FAILED_BEFORE_PUBLISHER',
                  'expected_source_revision':os.environ['GITHUB_SHA'],
                  'source_revision':None,'secret_values_recorded':False})+'\n')
          PY
      - name: Upload retained publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: holographic-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/szl-holographic-receipt.json
          if-no-files-found: error
          retention-days: 30
