# The original legacy-host gate was generated by szl-holdings/.github
# .github/scripts/holographic_target_contract.py at 3ef11ccd08c8350ff837c83735c802ff4d8323f9.
# This repository owns the native Space entrypoint migration below. Legacy asset
# checks remain intact; actual native resource binding and browser behavior are
# required in place of the retired HTML marker check.
name: SZL Public Experience v3 Contract

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  public-experience-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node for native browser qualification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify local responsive assets and source binding
        shell: bash
        env:
          SZL_HOLO_ENTRYPOINT: "space/index.html"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import os
          import py_compile
          import subprocess

          raw_asset_paths = ["space/szl-space-hologram.css", "space/szl-space-hologram.js"]
          asset_paths = []
          for raw in raw_asset_paths:
              path = Path(raw)
              if path.is_absolute() or '\\' in raw or '..' in path.parts:
                  raise SystemExit(f'unsafe declared holographic asset path: {raw}')
              asset_paths.append(path)
          missing_assets = [str(path) for path in asset_paths if not path.is_file()]
          if missing_assets:
              raise SystemExit(f'missing declared holographic assets: {missing_assets}')

          css_files = sorted(path for path in asset_paths if path.suffix.lower() == '.css')
          if not css_files:
              raise SystemExit('missing holographic CSS')
          css_required = (
              'SZL Public Experience v3',
              '--szl-touch-target',
              '100dvh',
              'safe-area-inset',
              'overflow-x: clip',
              'max-width: 479px',
              'min-width: 768px',
              'min-width: 1440px',
              'min-width: 1920px',
              'min-width: 2560px',
              'prefers-reduced-motion',
              'prefers-contrast',
              'forced-colors',
              '@media print',
          )
          for path in css_files:
              text = path.read_text(encoding='utf-8')
              missing = [item for item in css_required if item not in text]
              if missing:
                  raise SystemExit(f'{path}: missing responsive contracts: {missing}')
              prohibited = ('@import', 'cdn.', 'unpkg.', 'jsdelivr.')
              if any(item in text for item in prohibited):
                  raise SystemExit(f'{path}: external runtime asset')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'{path}: unbalanced CSS braces')

          js_files = sorted(path for path in asset_paths if path.suffix.lower() == '.js')
          prohibited_js = (
              'fetch(', 'XMLHttpRequest', 'sendBeacon', 'localStorage',
              'sessionStorage', 'document.cookie',
          )
          for path in js_files:
              text = path.read_text(encoding='utf-8')
              for marker in (
                  '__SZL_PUBLIC_EXPERIENCE_V3__',
                  'szlPublicExperienceV3',
                  'szlViewportTier',
                  'visualViewport',
                  'requestAnimationFrame',
              ):
                  if marker not in text:
                      raise SystemExit(f'{path}: missing {marker}')
              if any(item in text for item in prohibited_js):
                  raise SystemExit(f'{path}: prohibited client behavior')
              subprocess.run(['node', '--check', str(path)], check=True)

          py_files = sorted(
              path for path in Path('.').rglob('*.py')
              if path.name in {
                  'szl_hologram_assets.py',
                  'szl_hologram_streamlit.py',
              } and '.git' not in path.parts
          )
          entrypoint = os.environ.get('SZL_HOLO_ENTRYPOINT', '')
          if entrypoint and entrypoint.endswith('.py'):
              py_files.append(Path(entrypoint))
          for path in dict.fromkeys(py_files):
              py_compile.compile(str(path), doraise=True)

          if entrypoint:
              target = Path(entrypoint)
              if entrypoint != 'space/index.html' or not target.is_file():
                  raise SystemExit(f'missing entrypoint: {entrypoint}')
              # The actual HTML parser checks resource elements and exact order;
              # a filename in a comment cannot satisfy the native source binding.
              subprocess.run([
                  'python', '-I', '-B', '-m', 'unittest', 'discover',
                  '-s', 'tests', '-p', 'test_native_frontend.py',
              ], check=True)
          else:
              raise SystemExit('native entrypoint must be declared')
          PY
          git diff --check
      - name: Install the pinned browser harness outside the application
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/unify-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/unify-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Qualify the actual staged Space in Chromium
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/unify-browser/node_modules" node scripts/qualify_native_frontend.cjs
      - name: Retain unsigned local presentation observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-space-presentation
          path: artifacts/native-frontend
          if-no-files-found: warn
          retention-days: 7
